version: '3.8'

services:
  selfremote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selfremote-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    volumes:
      # Optional: Für Logging/Debugging
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - selfremote-net

networks:
  selfremote-net:
    driver: bridge
